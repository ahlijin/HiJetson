name: Build
on: [push]

jobs:
  build:
    runs-on: pi5
    steps:
      - name: Clone
        run: |
          rm -rf /tmp/ws
          git clone http://192.168.3.96:3000/legend/HiJetson.git /tmp/ws
          cd /tmp/ws
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.sha }}
          git submodule update --init --recursive

      - name: Build in my-ros
        run: |
          cd /tmp/ws
          docker run --rm \
            -v $PWD:/ws \
            -w /ws \
            my-ros:latest \
            bash -c "source /opt/ros/humble/setup.bash && colcon build"